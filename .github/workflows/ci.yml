name: CI & Verification Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Push Database Schema
        run: npx prisma db push --schema=apps/api/prisma/schema.prisma --accept-data-loss
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Run Test Suites (API & Web)
        run: npm test
        env:
          DATABASE_URL: "file:./dev.db"
          NODE_ENV: "test"
          JWT_SECRET: "sportspot_test_secret_key_32_characters"
          SESSION_SECRET: "sportspot_test_secret_key_32_characters"

      - name: Build Web Application
        run: npm run build --workspace=apps/web

      - name: Build API Service
        run: npm run build --workspace=apps/api
